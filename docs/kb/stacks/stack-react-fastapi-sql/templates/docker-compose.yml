services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
