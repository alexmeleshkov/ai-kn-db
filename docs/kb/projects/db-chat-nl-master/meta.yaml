# KB Project Metadata
# Used by: generator matching and validation

# ============================================================================
# IDENTIFICATION
# ============================================================================

id: db-chat-nl-master
# Unique identifier

name: Database Chat NL (Master)
# Human-readable name

description: Chat interface for querying PostgreSQL databases with natural language using Claude API
# Brief summary

status: reference
# This is a scanned reference project

# ============================================================================
# TECHNOLOGY STACK
# ============================================================================

# Major technologies - used for matching user requirements
technologies:
  - fastapi          # Backend framework
  - anthropic-claude # LLM for natural language to SQL
  - postgresql       # Database
  - react-hooks      # Frontend framework
  - jwt-bcrypt       # Authentication
  - sse              # Server-Sent Events for streaming
  - chartjs          # Data visualization
  - sqlalchemy       # Database ORM/query builder
  - typescript       # Type-safe frontend

# ============================================================================
# CAPABILITIES (What the project does)
# ============================================================================

# Core capabilities - used for matching user requirements to KB entries
capabilities:
  - jwt-authentication     # User login with JWT tokens
  - conversation-crud      # Save/load chat conversations
  - natural-language-sql   # Convert natural language to SQL queries
  - schema-introspection   # Analyze database schema
  - data-streaming         # Stream responses via SSE
  - admin-panel            # Admin interface
  - query-validation       # Validate SQL queries before execution
  - learning-store         # Store successful queries for few-shot learning
  - real-time-chat         # Real-time chat interface
  - data-visualization     # Visualize query results with charts

# ============================================================================
# ARCHITECTURE
# ============================================================================

# Architecture pattern
architecture_pattern: layered
# FastAPI backend with service layer, React frontend

# ============================================================================
# OPERATIONAL INFO (Run & Build)
# ============================================================================

# Prerequisites for running locally
run:
  prerequisites:
    - "Node.js >= 18.0.0"
    - "Python >= 3.11"
    - "Docker >= 24.0"
    - "PostgreSQL >= 14 (or via Docker)"

  env_vars:
    - DATABASE_URL
    - JWT_SECRET
    - ANTHROPIC_API_KEY
    - CORS_ORIGINS

  commands:
    - "npm install"
    - "pip install -r requirements.txt"
    - "docker-compose up"

# Build commands
build:
  commands:
    - "npm run build"
    - "docker build -t db-chat-nl:latest ."
