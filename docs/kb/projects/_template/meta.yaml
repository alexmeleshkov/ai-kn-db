# KB Project Metadata
# This file contains essential metadata for the knowledge base entry
# Used by: generator matching, stack resolution, validation

# ============================================================================
# IDENTIFICATION
# ============================================================================

id: [project-id]
# Unique identifier (lowercase, hyphens only)

name: [Project Name]
# Human-readable name

description: [One-line description of what this project does]
# Brief summary (max 200 chars)

status: stable
# Options: draft | stable | deprecated
# - draft: KB entry incomplete, not ready for generation
# - stable: Production-tested, ready for 1:1 generation
# - deprecated: Outdated, prefer newer alternatives

version: "1.0.0"
# Semantic version of KB entry (not project version)
# Increment when making significant KB updates

# ============================================================================
# TECHNOLOGY STACK
# ============================================================================

# Technology classification (high-level)
stack:
  frontend: [frontend-framework]  # react | vue | angular | svelte | none
  backend: [backend-framework]    # fastapi | express | django | flask | spring | none
  database: [database-type]       # postgresql | mysql | mongodb | redis | sqlite | none

# Technology stack reference (links to docs/kb/stacks/<stack-id>/)
# Used by generator for scaffolding
stack_ref: [stack-id]

# Major technologies (top 5-8, extracted from tech.md)
# Used for matching user requirements to KB entries
technologies:
  - [Technology 1]
  - [Technology 2]
  - [Technology 3]
  - [Technology 4]
  - [Technology 5]

# ============================================================================
# CAPABILITIES (What the project does)
# ============================================================================

# Core capabilities - used for matching user requirements
# Each capability should map to implementation in modules.md
capabilities:
  - [capability_1]
  - [capability_2]
  - [capability_3]
  - [capability_4]
  - [capability_5]

# ============================================================================
# ARCHITECTURE
# ============================================================================

# Architecture pattern (from architecture.md)
architecture_pattern: [pattern]  # layered | microservices | mvc | modular_monolith | event_driven

# Deployment platform (from deployment.md)
deployment:
  platform: [platform]           # heroku | aws | gcp | azure | docker | kubernetes
  environment: [environment]     # cloud | on_premise | hybrid

# ============================================================================
# QUALITY ATTRIBUTES
# ============================================================================

# Non-functional requirements
nfr:
  performance: [level]    # low | medium | high
  security: [level]       # low | medium | high
  scalability: [level]    # low | medium | high

# ============================================================================
# OPERATIONAL INFO
# ============================================================================

# Prerequisites for running locally (from deployment.md)
run:
  prerequisites:
    - [Prerequisite 1]
    - [Prerequisite 2]
    - [Prerequisite 3]
    - [API keys or credentials needed]

  commands:
    - [Command 1 to install dependencies]
    - [Command 2 to install dependencies]
    - [Command 3 to start services]

# Build/Deploy commands
build:
  commands:
    - [Build command 1]
    - [Build command 2]

# ============================================================================
# KB METADATA (Extraction info)
# ============================================================================

kb_metadata:
  created_date: "[ISO timestamp]"
  last_updated: "[ISO timestamp]"
  extractor_version: "[version]"
  source_repo: "[repository URL]"  # Optional
  extraction_method: [method]  # manual | automated
  coverage: [percentage]  # Percentage (0-100)

# ============================================================================
# VALIDATION CHECKLIST
# ============================================================================
# Before marking status: stable, ensure:
# ✅ modules.md has code patterns for all capabilities
# ✅ tech.md explains WHY each technology chosen
# ✅ architecture.md has design decisions with rationale
# ✅ deployment.md has exact build/run commands
# ✅ features.md separates must-have from nice-to-have
# ✅ All files reference actual file paths from source repo
