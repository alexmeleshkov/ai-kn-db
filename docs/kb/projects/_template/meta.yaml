# KB Project Metadata
# Used by: generator matching and validation

# ============================================================================
# IDENTIFICATION
# ============================================================================

id: [project-id]
# Unique identifier (lowercase, hyphens only, e.g., "db-chat-nl")

name: [Project Name]
# Human-readable name (e.g., "Database Chat NL")

description: [One-line description of what this project does]
# Brief summary, max 200 chars (e.g., "Chat interface for querying databases with natural language")

status: stable
# Options: draft | stable | deprecated

# ============================================================================
# TECHNOLOGY STACK
# ============================================================================

# Major technologies (top 5-8) - used for matching user requirements
technologies:
  - [Technology 1]  # e.g., React 18
  - [Technology 2]  # e.g., FastAPI
  - [Technology 3]  # e.g., PostgreSQL
  - [Technology 4]  # e.g., TypeScript
  - [Technology 5]  # e.g., Docker

# ============================================================================
# CAPABILITIES (What the project does)
# ============================================================================

# Core capabilities - used for matching user requirements to KB entries
# Each capability should have implementation details in modules.md
capabilities:
  - [capability_1]  # e.g., "user_authentication"
  - [capability_2]  # e.g., "nl_to_sql_generation"
  - [capability_3]  # e.g., "real_time_data_streaming"
  - [capability_4]  # e.g., "data_visualization"
  - [capability_5]  # e.g., "database_schema_introspection"

# ============================================================================
# ARCHITECTURE
# ============================================================================

# Architecture pattern (from architecture.md)
architecture_pattern: [pattern]
# Options: layered | microservices | mvc | modular_monolith | event_driven | hexagonal

# ============================================================================
# OPERATIONAL INFO (Run & Build)
# ============================================================================

# Prerequisites for running locally
run:
  prerequisites:
    - [Prerequisite 1]  # e.g., "Node.js >= 18.0.0"
    - [Prerequisite 2]  # e.g., "Python >= 3.11"
    - [Prerequisite 3]  # e.g., "Docker >= 24.0"
    - [Prerequisite 4]  # e.g., "PostgreSQL >= 14 (or via Docker)"

  env_vars:
    - [VAR_1]  # e.g., "DATABASE_URL"
    - [VAR_2]  # e.g., "JWT_SECRET"
    - [VAR_3]  # e.g., "ANTHROPIC_API_KEY"
    - [VAR_4]  # e.g., "CORS_ORIGINS"

  commands:
    - [Command 1]  # e.g., "npm install"
    - [Command 2]  # e.g., "pip install -r requirements.txt"
    - [Command 3]  # e.g., "docker-compose up"

# Build commands (if different from run)
build:
  commands:
    - [Build command 1]  # e.g., "npm run build"
    - [Build command 2]  # e.g., "docker build -t project:latest ."

# Smoke test - critical for validating generated projects
smoke_test:
  command: [smoke test command]  # e.g., "npm run smoke" or "./scripts/smoke-test.sh"
  description: [what it verifies]  # e.g., "Verifies backend starts, frontend builds, API responds"
