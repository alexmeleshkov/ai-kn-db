id: template-project
name: Template Project
status: draft # draft | stable | deprecated

# High-level classification
project_type: web-app # web-app | api | cli | mobile | library | service
domain_tags:
  - example-domain

# What users can do (capabilities)
# Enhanced format: structured objects with dependencies
capabilities:
  example_capability:
    description: "Brief description of what this capability enables"
    complexity: medium  # low | medium | high
    frontend_dependencies:
      - example-package@^1.0.0
    backend_dependencies:
      - example-package>=1.0.0
    env_vars:
      - EXAMPLE_VAR

# Alternative: simple list format (legacy, less information)
# capabilities:
#   - example_capability

# Recommended technology stack reference (from docs/kb/stacks)
stack_ref: stack-example

# Reusable patterns used by this project (from docs/kb/patterns)
pattern_refs:
  - pattern-example

# Non-functional requirements (optional)
nfr:
  performance: medium # low | medium | high
  security: medium
  scalability: medium

# How to run locally (short pointers, detailed in runbook if needed)
run:
  prerequisites:
    - Node.js 20+
  commands:
    - npm install
    - npm run dev
