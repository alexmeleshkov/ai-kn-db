# KB Project Metadata
# Used by: generator matching and validation

# ============================================================================
# IDENTIFICATION
# ============================================================================

id: db-chat-nl
# Unique identifier

name: Database Chat NL
# Human-readable name

description: Natural language chat interface for querying databases with AI-powered SQL generation and streaming responses
# Brief summary

status: stable
# Fully implemented and production-ready

# ============================================================================
# TECHNOLOGY STACK
# ============================================================================

# Major technologies (top 5-8) - used for matching user requirements
technologies:
  - React 18 with TypeScript
  - FastAPI (Python)
  - PostgreSQL for auth/data storage
  - DuckDB for JSON querying
  - Anthropic Claude API (Tool Use)
  - JWT Authentication
  - Server-Sent Events (SSE)
  - Docker

# ============================================================================
# CAPABILITIES (What the project does)
# ============================================================================

# Core capabilities - used for matching user requirements to KB entries
# Each capability has implementation details in modules.md
capabilities:
  - user_authentication  # JWT-based auth with bcrypt password hashing
  - nl_to_sql_generation  # Natural language to SQL using Claude with Tool Use
  - real_time_streaming  # Server-Sent Events for streaming AI responses
  - database_introspection  # Schema discovery for DuckDB, PostgreSQL, Azure SQL
  - agentic_sql_execution  # Claude autonomously executes and retries queries
  - conversation_persistence  # Save and load chat conversations
  - multi_database_support  # DuckDB (JSON), PostgreSQL (RDS), Azure SQL Server
  - query_intelligence  # Few-shot learning, query caching, error patterns
  - admin_panel  # View all user conversations

# ============================================================================
# ARCHITECTURE
# ============================================================================

# Architecture pattern (from architecture.md)
architecture_pattern: layered
# Three-layer: Frontend (React) -> API (FastAPI) -> Services (LLM, DB, Auth)

# ============================================================================
# OPERATIONAL INFO (Run & Build)
# ============================================================================

# Prerequisites for running locally
run:
  prerequisites:
    - Node.js >= 18.0.0
    - Python >= 3.11
    - Docker >= 24.0 (optional, for PostgreSQL)
    - PostgreSQL >= 14 (for auth/conversations)

  env_vars:
    - ANTHROPIC_API_KEY  # Required for Claude API
    - DATABASE_URL  # PostgreSQL connection for auth/conversations
    - JWT_SECRET  # Secret for JWT token signing
    - CORS_ORIGINS  # Frontend URL for CORS
    - DEBUG  # Enable debug logging

  commands:
    - cd frontend && npm install
    - cd backend && pip install -r requirements.txt
    - docker-compose up  # Runs both frontend and backend

# Build commands
build:
  commands:
    - cd frontend && npm run build
    - docker build -t db-chat-nl:latest .

# Smoke test
smoke_test:
  command: curl http://localhost:8000/api/v1/health && curl http://localhost:3000
  description: Verifies backend API responds and frontend serves
