# KB Project Metadata
# Used by: generator matching and validation

# ============================================================================
# IDENTIFICATION
# ============================================================================

id: db-chat-nl-complete
# Unique identifier (lowercase, hyphens only)

name: Database Chat NL (Complete)
# Human-readable name

description: Natural language interface for querying databases using Claude AI with extended thinking, SSE streaming, JWT auth, and conversation persistence
# Brief summary, max 200 chars

status: reference
# Options: draft | stable | deprecated | reference

# ============================================================================
# TECHNOLOGY STACK
# ============================================================================

# Major technologies (top 5-8) - used for matching user requirements
technologies:
  - React 18
  - TypeScript 5.2
  - FastAPI
  - Python 3.11
  - PostgreSQL
  - Azure SQL Server
  - Claude Opus 4
  - Docker

# ============================================================================
# CAPABILITIES (What the project does)
# ============================================================================

# Core capabilities - used for matching user requirements to KB entries
# Each capability should have implementation details in modules.md
capabilities:
  - nl_to_sql_generation
  - llm_streaming_responses
  - jwt_authentication
  - conversation_persistence
  - database_schema_introspection
  - query_result_visualization
  - few_shot_learning
  - agentic_tool_use
  - extended_thinking
  - multi_database_support
  - admin_user_management
  - query_history_management

# ============================================================================
# ARCHITECTURE
# ============================================================================

# Architecture pattern (from architecture.md)
architecture_pattern: layered
# Options: layered | microservices | mvc | modular_monolith | event_driven | hexagonal

# ============================================================================
# OPERATIONAL INFO (Run & Build)
# ============================================================================

# Prerequisites for running locally
run:
  prerequisites:
    - Node.js >= 18.0.0
    - Python >= 3.11
    - Docker >= 24.0 (optional, for containerized deployment)
    - PostgreSQL >= 14 (or via Docker)
    - Anthropic API key

  env_vars:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_MODEL
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_DATABASE
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - JWT_SECRET
    - DB_MODE
    - AZURE_SQL_SERVER
    - AZURE_SQL_DATABASE
    - AZURE_SQL_USER
    - AZURE_SQL_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - S3_BUCKET
    - QUOTAGUARDSTATIC_URL
    - CORS_ORIGINS
    - MAX_QUERY_RESULTS
    - QUERY_TIMEOUT

  commands:
    - cd frontend && npm install
    - cd backend && pip install -r requirements.txt
    - cp backend/.env.example backend/.env
    - docker-compose up

# Build commands (if different from run)
build:
  commands:
    - cd frontend && npm run build
    - cp -r frontend/dist/* backend/static/
    - docker build -t db-chat-nl:latest .
