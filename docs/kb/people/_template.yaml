# Person Profile Template

name: [Full Name]
role: [Job Title]
team: [Team/Department]

# Contact Information
contact:
  email: [email@company.com]
  github: [github-username]
  linkedin: [linkedin-url]
  slack: [@slack-handle]

# Expertise & Skills
expertise:
  # Technologies
  technologies:
    - [technology-1]  # Expert level
    - [technology-2]  # Proficient
    - [technology-3]  # Working knowledge

  # Languages
  languages:
    - [language-1]    # Expert
    - [language-2]    # Proficient

  # Domains
  domains:
    - [domain-1]      # e.g., AI/ML, DevOps, Frontend
    - [domain-2]

# Project Ownership
owns:
  - [project-1]       # Primary owner
  - [project-2]

contributes_to:
  - [project-3]       # Contributor
  - [project-4]

# Knowledge Contributions
authored_insights:
  - [insight-1]
  - [insight-2]

# Specializations
specializations:
  - [specialization-1]  # e.g., Database optimization
  - [specialization-2]  # e.g., Performance tuning
  - [specialization-3]

# Availability
available_for:
  - code-review       # Available for reviewing code
  - consulting        # Available for technical consultation
  - mentoring         # Available for mentoring
  - pair-programming  # Available for pairing

# Learning Goals (Optional)
learning:
  - [technology/skill they're learning]
  - [technology/skill they want to learn]

# Notes (Optional)
notes: |
  Additional information about the person, their preferences,
  working style, timezone, etc.

# Metadata
joined: YYYY-MM-DD
updated: YYYY-MM-DD
